interface:
  display_name: "华朗学校 Hualang School"
  short_description: "华朗汇报与分学科教案课件，充分分析、多样构图与内容复核"
  icon_large: "./assets/preview.png"
  default_prompt: "使用 $artifact-template-hualang-school，先从材料展开充分的比较、解释、取舍与落实，再按读者动作选择主体构图和局部组件。图与相关分析同屏，短页按需要深化或合并，保留完整内容与条件；不虚构缺少的原因和承诺。联排检查真实页面的重复骨架；教学按实际能力使用有理解收益的动画。交付前核对知识、案例、题解和数据，发现问题主动说明并给建议。"
policy:
  allow_implicit_invocation: true
